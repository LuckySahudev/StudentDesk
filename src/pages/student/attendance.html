<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudentDesk | Student Attendance</title>
    <link rel="stylesheet" href="/css/student.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  </head>
  <body>
    <header>
      <nav class="nav-bar">
        <div class="logo">
          <div class="logo-icon"><i class="ti ti-school"></i></div>
          <h1>Student</h1>
        </div>
        <div class="left-access"><button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false"><i class="ti ti-sun"></i></button><button class="profile-img" aria-label="Profile"><i class="bi bi-person-circle"></i></button></div>
      </nav>
    </header>
    <main>
<section class="container" aria-label="Attendance">
        
        <div class="Attendance">
          <div class="page-header">
            <div>
              <h2>Attendance</h2>
              <p>A session without an attendance record is counted as absent.</p>
            </div>
          
              <a class="back-to-dashboard" href="/student/"><i class="ti ti-arrow-left"></i>Back to Dashboard</a>
            </div>

          <div class="attendance-stats">
            <div class="stat-card">
              <h4>Attendance %</h4>
              <h2 id="attendance-percentage">—</h2>
            </div>

            <div class="stat-card">
              <h4>Present</h4>
              <h2 id="attendance-present">0</h2>
            </div>

            <div class="stat-card">
              <h4>Absent</h4>
              <h2 id="attendance-absent">0</h2>
            </div>

            <div class="stat-card">
              <h4>Total Classes</h4>
              <h2 id="attendance-total">0</h2>
            </div>
          </div>

          <div class="attendance-filters">
            <label for="attendance-from">From</label>
            <input id="attendance-from" type="date" />
            <label for="attendance-to">To</label>
            <input id="attendance-to" type="date" />
            <select id="attendance-status" aria-label="Attendance status">
              <option value="all">All statuses</option>
              <option value="present">Present</option>
              <option value="absent">Absent</option>
            </select>
            <button class="view-btn" id="attendance-view" type="button">
              <i class="ti ti-search"></i>
              View
            </button>
          </div>

          <div class="attendance-table">
            <table>
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Class</th>
                  <th>Academic Year</th>
                  <th>Roll Number</th>
                  <th>Marked By</th>
                  <th>Status</th>
                </tr>
              </thead>

              <tbody>
                <tr><td colspan="6" id="attendance-table-message">Loading attendance...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
      <script src="/js/theme.js"></script>
      <script src="/js/student-attendance.js"></script>
  </body>
</html>
