<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudentDesk | Student Exams</title>
    <link rel="stylesheet" href="/css/student.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  </head>
  <body>
    <header>
      <nav class="nav-bar">
        <div class="logo">
          <div class="logo-icon"><i class="ti ti-school"></i></div>
          <h1>Student</h1>
        </div>
        <div class="left-access"><button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false"><i class="ti ti-sun"></i></button><button class="profile-img" aria-label="Profile"><i class="bi bi-person-circle"></i></button></div>
      </nav>
    </header>
    <main>
<section class="container" aria-label="Exams">
        
        <div class="Exam">
          <div class="page-head">
            <div>
              <h2>Examinations</h2>
              <p id="exam-enrollment">Loading exams...</p>
            </div>
          
              <a class="back-to-dashboard" href="/student/"><i class="ti ti-arrow-left"></i>Back to Dashboard</a>
            </div>

          <div class="exam-stats">
            <div class="stat-card">
              <h4>Total Exams</h4>
              <h2 id="exam-total">0</h2>
            </div>

            <div class="stat-card">
              <h4>Upcoming</h4>
              <h2 id="exam-upcoming">0</h2>
            </div>

            <div class="stat-card">
              <h4>Completed</h4>
              <h2 id="exam-completed">0</h2>
            </div>

            <div class="stat-card">
              <h4>Next Exam</h4>
              <h2 id="exam-next">—</h2>
            </div>
          </div>

          <div class="exam-filters">
            <select id="exam-filter" aria-label="Filter by exam"><option value="all">All exams</option></select>

            <button class="view-btn" id="exam-view" type="button">
              <i class="ti ti-search"></i>
              View
            </button>
          </div>

          <div class="exam-table">
            <table>
              <thead>
                <tr>
                  <th>Exam</th>
                  <th>Exam Dates</th>
                  <th>Total Marks</th>
                  <th>Passing Marks</th>
                  <th>Result</th>
                  <th>Schedule</th>
                </tr>
              </thead>

              <tbody>
                <tr>
                  <td colspan="6" id="exam-table-message">Loading exams...</td>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
      <script src="/js/theme.js"></script>
      <script src="/js/student-exams.js"></script>
  </body>
</html>
