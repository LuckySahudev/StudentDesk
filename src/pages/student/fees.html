<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudentDesk | Student Fees</title>
    <link rel="stylesheet" href="/css/student.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  </head>
  <body>
    <header>
      <nav class="nav-bar">
        <div class="logo"><div class="logo-icon"><i class="ti ti-school"></i></div><h1>Student</h1></div>
        <div class="left-access"><button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false"><i class="ti ti-sun"></i></button><button class="profile-img" aria-label="Profile"><i class="bi bi-person-circle"></i></button></div>
      </nav>
    </header>
    <main>
      <section class="container" aria-label="Fees">
        <div class="Fees">
          <div class="page-head">
            <div><h2>Fees</h2><p id="fee-enrollment">View fee details and payment history</p></div>
            <a class="back-to-dashboard" href="/student/"><i class="ti ti-arrow-left"></i>Back to Dashboard</a>
          </div>
          <div class="fee-stats">
            <div class="stat-card"><h4>Total Fees</h4><h2 id="fee-total">—</h2></div>
            <div class="stat-card"><h4>Paid</h4><h2 id="fee-paid">—</h2></div>
            <div class="stat-card"><h4>Pending</h4><h2 id="fee-pending">—</h2></div>
            <div class="stat-card"><h4>Payments Recorded</h4><h2 id="fee-payment-count">—</h2></div>
          </div>
          <div class="fee-filters">
            <select id="fee-academic-year" aria-label="Academic year"><option value="">All academic years</option></select>
            <select id="fee-type" aria-label="Fee type"><option value="">All fee types</option></select>
            <button class="view-btn" id="fee-view" type="button"><i class="ti ti-search"></i> View</button>
          </div>
          <div class="fee-table">
            <table>
              <thead><tr><th>Academic Year</th><th>Fee</th><th>Type</th><th>Amount</th><th>Paid</th><th>Balance</th><th>Status</th></tr></thead>
              <tbody id="fee-rows"><tr><td colspan="7">Loading fees...</td></tr></tbody>
            </table>
          </div>
          <h3 class="fee-history-title">Payment history</h3>
          <div class="fee-table">
            <table>
              <thead><tr><th>Receipt</th><th>Date</th><th>Fee</th><th>Type</th><th>Method</th><th>Reference</th><th>Amount</th></tr></thead>
              <tbody id="fee-payment-rows"><tr><td colspan="7">Loading payments...</td></tr></tbody>
            </table>
          </div>
          <p id="fee-message" class="fee-message" role="status" aria-live="polite"></p>
        </div>
      </section>
    </main>
    <script src="/js/theme.js"></script>
    <script src="/js/student-fees.js"></script>
  </body>
</html>
