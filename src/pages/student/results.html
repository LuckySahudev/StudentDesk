<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudentDesk | Student Results</title>
    <link rel="stylesheet" href="/css/student.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  </head>
  <body>
    <header>
      <nav class="nav-bar">
        <div class="logo">
          <div class="logo-icon"><i class="ti ti-school"></i></div>
          <h1>Student</h1>
        </div>
        <div class="left-access"><button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false"><i class="ti ti-sun"></i></button><button class="profile-img" aria-label="Profile"><i class="bi bi-person-circle"></i></button></div>
      </nav>
    </header>
    <main>
<section class="container" aria-label="Results">
        
        <div class="Result">
          <div class="page-head">
            <div>
              <h2>Results</h2>
              <p>View your academic performance</p>
            </div>
          
              <a class="back-to-dashboard" href="/student/"><i class="ti ti-arrow-left"></i>Back to Dashboard</a>
            </div>

          <div class="result-stats">
            <div class="stat-card">
              <h4>Overall Percentage</h4>
              <h2>88%</h2>
            </div>

            <div class="stat-card">
              <h4>Grade</h4>
              <h2>A</h2>
            </div>

            <div class="stat-card">
              <h4>Rank</h4>
              <h2>12</h2>
            </div>

            <div class="stat-card">
              <h4>Exams Taken</h4>
              <h2>5</h2>
            </div>
          </div>

          <div class="result-filters">
            <select>
              <option selected disabled>Select Exam</option>
              <option>Unit Test 1</option>
              <option>Unit Test 2</option>
              <option>Quarterly Exam</option>
              <option>Half Yearly Exam</option>
              <option>Pre Board</option>
              <option>Annual Exam</option>
            </select>

            <button class="view-btn">
              <i class="ti ti-search"></i>
              View Result
            </button>
          </div>

          <div class="result-table">
            <table>
              <thead>
                <tr>
                  <th>Subject</th>
                  <th>Marks Obtained</th>
                  <th>Total Marks</th>
                  <th>Percentage</th>
                  <th>Grade</th>
                </tr>
              </thead>

              <tbody>
                <tr>
                  <td>Mathematics</td>
                  <td>88</td>
                  <td>100</td>
                  <td>88%</td>
                  <td>A</td>
                </tr>

                <tr>
                  <td>Science</td>
                  <td>91</td>
                  <td>100</td>
                  <td>91%</td>
                  <td>A+</td>
                </tr>

                <tr>
                  <td>English</td>
                  <td>82</td>
                  <td>100</td>
                  <td>82%</td>
                  <td>A</td>
                </tr>

                <tr>
                  <td>Social Science</td>
                  <td>85</td>
                  <td>100</td>
                  <td>85%</td>
                  <td>A</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
      <script src="/js/theme.js"></script>
  </body>
</html>
