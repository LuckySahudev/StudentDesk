<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudentDesk | Student Notices</title>
    <link rel="stylesheet" href="/css/student.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  </head>
  <body>
    <header>
      <nav class="nav-bar">
        <div class="logo">
          <div class="logo-icon"><i class="ti ti-school"></i></div>
          <h1>Student</h1>
        </div>
        <div class="left-access"><button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false"><i class="ti ti-sun"></i></button><button class="profile-img" aria-label="Profile"><i class="bi bi-person-circle"></i></button></div>
      </nav>
    </header>
    <main>
<section class="container" aria-label="Notices">
        
        <div class="Notice">
          <div class="page-head">
            <div>
              <h2>Notices</h2>
              <p>View current and upcoming school-wide and class notices</p>
            </div>
          
              <a class="back-to-dashboard" href="/student/"><i class="ti ti-arrow-left"></i>Back to Dashboard</a>
            </div>

          <div class="notice-stats">
            <div class="stat-card">
              <h4>Current Notices</h4>
              <h2 id="notice-total">—</h2>
            </div>

            <div class="stat-card">
              <h4>Class Notices</h4>
              <h2 id="notice-class-total">—</h2>
            </div>

            <div class="stat-card">
              <h4>School-wide</h4>
              <h2 id="notice-school-total">—</h2>
            </div>

            <div class="stat-card">
              <h4>Latest Date</h4>
              <h2 id="notice-latest-date">—</h2>
            </div>
          </div>

          <div class="notice-filters">
            <input id="notice-search" type="search" placeholder="Search notices..." aria-label="Search notices" />
            <select id="notice-audience" aria-label="Filter by audience">
              <option value="all">All audiences</option>
              <option value="class">Class notices</option>
              <option value="school">School-wide</option>
            </select>
          </div>

          <div class="notice-table">
            <table>
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Title</th>
                  <th>Notice</th>
                  <th>Audience</th>
                  <th>Posted by</th>
                  <th>Expires</th>
                </tr>
              </thead>

              <tbody>
                <tr><td colspan="6" id="notice-table-message">Loading notices...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
      <script src="/js/theme.js"></script>
      <script src="/js/student-notices.js"></script>
  </body>
</html>
