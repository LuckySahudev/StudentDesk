<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudentDesk | Student Timetable</title>
    <link rel="stylesheet" href="/css/student.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  </head>
  <body>
    <header>
      <nav class="nav-bar">
        <div class="logo">
          <div class="logo-icon"><i class="ti ti-school"></i></div>
          <h1>Student</h1>
        </div>
        <div class="left-access"><button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false"><i class="ti ti-sun"></i></button><button class="profile-img" aria-label="Profile"><i class="bi bi-person-circle"></i></button></div>
      </nav>
    </header>
    <main>
<section class="container" aria-label="Timetable">
        
        <div class="Timetable">
          <div class="page-head">
            <div>
              <h2>Timetable</h2>
              <p id="timetable-enrollment">Loading your class schedule...</p>
            </div>
          
              <a class="back-to-dashboard" href="/student/"><i class="ti ti-arrow-left"></i>Back to Dashboard</a>
            </div>

          <div class="timetable-filters">
            <select id="timetable-day" aria-label="Filter timetable by day">
              <option value="all">All days</option>
              <option>Monday</option>
              <option>Tuesday</option>
              <option>Wednesday</option>
              <option>Thursday</option>
              <option>Friday</option>
              <option>Saturday</option>
              <option>Sunday</option>
            </select>

            <button class="view-btn" id="timetable-view" type="button">
              <i class="ti ti-search"></i>
              View
            </button>
          </div>

          <div class="timetable-table">
            <table>
              <thead>
                <tr>
                  <th>Day</th>
                  <th>Period</th>
                  <th>Subject</th>
                  <th>Teacher</th>
                </tr>
              </thead>

              <tbody>
                <tr><td colspan="4" id="timetable-message">Loading timetable...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
      <script src="/js/theme.js"></script>
      <script src="/js/student-timetable.js"></script>
  </body>
</html>
