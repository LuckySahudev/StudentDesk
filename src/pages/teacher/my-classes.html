<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudentDesk | Teacher My Classes</title>
    <link rel="stylesheet" href="/css/teacher.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  </head>
  <body>
    <header>
      <nav class="nav-bar">
        <div class="logo">
          <div class="logo-icon"><i class="ti ti-school"></i></div>
          <h1>Teacher</h1>
        </div>
        <div class="left-access"><button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false"><i class="ti ti-sun"></i></button><button class="profile-img" aria-label="Profile"><i class="bi bi-person-circle"></i></button></div>
      </nav>
    </header>
    <main>
<section class="container" aria-label="My Classes">
        
        <div class="MyClasses">
          <div class="page-head">
            <div>
              <h2>My Classes</h2>
              <p>View and manage assigned classes</p>
            </div>
          
              <a class="back-to-dashboard" href="/teacher/"><i class="ti ti-arrow-left"></i>Back to Dashboard</a>
            </div>

          <div class="class-stats">
            <div class="stat-card">
              <h4>Total Classes</h4>
              <h2>3</h2>
            </div>

            <div class="stat-card">
              <h4>Total Students</h4>
              <h2>120</h2>
            </div>

            <div class="stat-card">
              <h4>Subjects</h4>
              <h2>2</h2>
            </div>

            <div class="stat-card">
              <h4>Today's Classes</h4>
              <h2>5</h2>
            </div>
          </div>

          <div class="class-filters">
            <select>
              <option selected disabled>Select Class</option>
              <option>9A</option>
              <option>10A</option>
              <option>10B</option>
            </select>

            <button class="view-btn">
              <i class="ti ti-search"></i>
              View
            </button>
          </div>

          <div class="class-table">
            <table>
              <thead>
                <tr>
                  <th>Class</th>
                  <th>Section</th>
                  <th>Subject</th>
                  <th>Students</th>
                  <th>Class Teacher</th>
                  <th>Actions</th>
                </tr>
              </thead>

              <tbody>
                <tr>
                  <td>9</td>
                  <td>A</td>
                  <td>Mathematics</td>
                  <td>40</td>
                  <td>Yes</td>
                  <td>
                    <button><i class="ti ti-eye"></i></button>
                  </td>
                </tr>

                <tr>
                  <td>10</td>
                  <td>A</td>
                  <td>Mathematics</td>
                  <td>42</td>
                  <td>No</td>
                  <td>
                    <button><i class="ti ti-eye"></i></button>
                  </td>
                </tr>

                <tr>
                  <td>10</td>
                  <td>B</td>
                  <td>Mathematics</td>
                  <td>38</td>
                  <td>No</td>
                  <td>
                    <button><i class="ti ti-eye"></i></button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
      <script src="/js/theme.js"></script>
  </body>
</html>
