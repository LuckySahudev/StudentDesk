<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudentDesk | Teacher Results</title>
    <link rel="stylesheet" href="/css/teacher.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  </head>
  <body>
    <header>
      <nav class="nav-bar">
        <div class="logo">
          <div class="logo-icon"><i class="ti ti-school"></i></div>
          <h1>Teacher</h1>
        </div>
        <div class="left-access"><button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false"><i class="ti ti-sun"></i></button><button class="profile-img" aria-label="Profile"><i class="bi bi-person-circle"></i></button></div>
      </nav>
    </header>
    <main>
<section class="container" aria-label="Results">
        
        <div class="Result">
          <div class="page-head">
            <div>
              <h2>Results</h2>
              <p>Manage and publish student results</p>
            </div>

            <button class="publish-btn">
              <i class="ti ti-upload"></i>
              Publish Results
            </button>
          
              <a class="back-to-dashboard" href="/teacher/"><i class="ti ti-arrow-left"></i>Back to Dashboard</a>
            </div>

          <div class="result-stats">
            <div class="stat-card">
              <h4>Total Results</h4>
              <h2>320</h2>
            </div>

            <div class="stat-card">
              <h4>Passed</h4>
              <h2>290</h2>
            </div>

            <div class="stat-card">
              <h4>Failed</h4>
              <h2>30</h2>
            </div>

            <div class="stat-card">
              <h4>Pass Rate</h4>
              <h2>91%</h2>
            </div>
          </div>

          <div class="result-filters">
            <select>
              <option selected disabled>Select Class</option>
              <option>6A</option>
              <option>7A</option>
              <option>8A</option>
              <option>9A</option>
              <option>10A</option>
            </select>

            <select>
              <option selected disabled>Select Exam</option>
              <option>Unit Test 1</option>
              <option>Unit Test 2</option>
              <option>Quarterly Exam</option>
              <option>Half Yearly Exam</option>
              <option>Pre Board</option>
              <option>Annual Exam</option>
            </select>

            <button class="view-btn">
              <i class="ti ti-search"></i>
              View Results
            </button>
          </div>

          <div class="result-table">
            <table>
              <thead>
                <tr>
                  <th>Roll No</th>
                  <th>Student Name</th>
                  <th>Class</th>
                  <th>Percentage</th>
                  <th>Grade</th>
                  <th>Result</th>
                  <th>Actions</th>
                </tr>
              </thead>

              <tbody>
                <tr>
                  <td>101</td>
                  <td>Rahul Sharma</td>
                  <td>10A</td>
                  <td>89%</td>
                  <td>A</td>
                  <td>Pass</td>
                  <td>
                    <button><i class="ti ti-eye"></i></button>
                    <button><i class="ti ti-edit"></i></button>
                  </td>
                </tr>

                <tr>
                  <td>102</td>
                  <td>Priya Patel</td>
                  <td>10A</td>
                  <td>94%</td>
                  <td>A+</td>
                  <td>Pass</td>
                  <td>
                    <button><i class="ti ti-eye"></i></button>
                    <button><i class="ti ti-edit"></i></button>
                  </td>
                </tr>

                <tr>
                  <td>103</td>
                  <td>Aman Verma</td>
                  <td>10A</td>
                  <td>38%</td>
                  <td>D</td>
                  <td>Fail</td>
                  <td>
                    <button><i class="ti ti-eye"></i></button>
                    <button><i class="ti ti-edit"></i></button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
      <script src="/js/theme.js"></script>
  </body>
</html>
