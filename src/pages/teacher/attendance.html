<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudentDesk | Teacher Attendance</title>
    <link rel="stylesheet" href="/css/teacher.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  </head>
  <body>
    <header>
      <nav class="nav-bar">
        <div class="logo">
          <div class="logo-icon"><i class="ti ti-school"></i></div>
          <h1>Teacher</h1>
        </div>
        <div class="left-access"><button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false"><i class="ti ti-sun"></i></button><button class="profile-img" aria-label="Profile"><i class="bi bi-person-circle"></i></button></div>
      </nav>
    </header>
    <main>
<section class="container" aria-label="Attendance">
        
        <div class="Attendance">
          <div class="page-head">
            <div>
              <h2>Attendance</h2>
              <p>Manage student attendance records</p>
            </div>

            <button class="mark-btn">
              <i class="ti ti-calendar-check"></i>
              Save Attendance
            </button>
          
              <a class="back-to-dashboard" href="/teacher/"><i class="ti ti-arrow-left"></i>Back to Dashboard</a>
            </div>

          <div class="attendance-stats">
            <div class="stat-card">
              <h4>Total Students</h4>
              <h2>40</h2>
            </div>

            <div class="stat-card">
              <h4>Present</h4>
              <h2>36</h2>
            </div>

            <div class="stat-card">
              <h4>Absent</h4>
              <h2>4</h2>
            </div>

            <div class="stat-card">
              <h4>Attendance %</h4>
              <h2>90%</h2>
            </div>
          </div>

          <div class="attendance-filters">
            <select>
              <option selected disabled>Select Class</option>
              <option>9A</option>
              <option>10A</option>
              <option>10B</option>
            </select>

            <input type="date" />

            <button class="view-btn">
              <i class="ti ti-search"></i>
              Load Students
            </button>
          </div>

          <div class="attendance-table">
            <table>
              <thead>
                <tr>
                  <th>Roll No</th>
                  <th>Student Name</th>
                  <th>Class</th>
                  <th>Status</th>
                </tr>
              </thead>

              <tbody>
                <tr>
                  <td>101</td>
                  <td>Rahul Sharma</td>
                  <td>10A</td>
                  <td>
                    <select>
                      <option selected>Present</option>
                      <option>Absent</option>
                    </select>
                  </td>
                </tr>

                <tr>
                  <td>102</td>
                  <td>Priya Patel</td>
                  <td>10A</td>
                  <td>
                    <select>
                      <option selected>Present</option>
                      <option>Absent</option>
                    </select>
                  </td>
                </tr>

                <tr>
                  <td>103</td>
                  <td>Aman Verma</td>
                  <td>10A</td>
                  <td>
                    <select>
                      <option>Present</option>
                      <option selected>Absent</option>
                    </select>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
      <script src="/js/theme.js"></script>
  </body>
</html>
