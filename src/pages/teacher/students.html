<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudentDesk | Teacher Students</title>
    <link rel="stylesheet" href="/css/teacher.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  </head>
  <body>
    <header>
      <nav class="nav-bar">
        <div class="logo">
          <div class="logo-icon"><i class="ti ti-school"></i></div>
          <h1>Teacher</h1>
        </div>
        <div class="left-access"><button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false"><i class="ti ti-sun"></i></button><button class="profile-img" aria-label="Profile"><i class="bi bi-person-circle"></i></button></div>
      </nav>
    </header>
    <main>
<section class="container" aria-label="Students">
        
        <div class="Students">
          <div class="page-head">
            <div>
              <h2>Students</h2>
              <p>View students from your assigned classes</p>
            </div>
          
              <a class="back-to-dashboard" href="/teacher/"><i class="ti ti-arrow-left"></i>Back to Dashboard</a>
            </div>

          <div class="student-stats">
            <div class="stat-card">
              <h4>Total Students</h4>
              <h2>120</h2>
            </div>

            <div class="stat-card">
              <h4>Boys</h4>
              <h2>65</h2>
            </div>

            <div class="stat-card">
              <h4>Girls</h4>
              <h2>55</h2>
            </div>

            <div class="stat-card">
              <h4>Classes</h4>
              <h2>3</h2>
            </div>
          </div>

          <div class="student-filters">
            <input type="text" placeholder="Search Student..." />

            <select>
              <option selected disabled>Select Class</option>
              <option>9A</option>
              <option>10A</option>
              <option>10B</option>
            </select>

            <button class="view-btn">
              <i class="ti ti-search"></i>
              Search
            </button>
          </div>

          <div class="student-table">
            <table>
              <thead>
                <tr>
                  <th>Roll No</th>
                  <th>Name</th>
                  <th>Class</th>
                  <th>Gender</th>
                  <th>Attendance</th>
                  <th>Actions</th>
                </tr>
              </thead>

              <tbody>
                <tr>
                  <td>101</td>
                  <td>Rahul Sharma</td>
                  <td>10A</td>
                  <td>Male</td>
                  <td>92%</td>
                  <td>
                    <button><i class="ti ti-eye"></i></button>
                  </td>
                </tr>

                <tr>
                  <td>102</td>
                  <td>Priya Patel</td>
                  <td>10A</td>
                  <td>Female</td>
                  <td>95%</td>
                  <td>
                    <button><i class="ti ti-eye"></i></button>
                  </td>
                </tr>

                <tr>
                  <td>103</td>
                  <td>Aman Verma</td>
                  <td>10B</td>
                  <td>Male</td>
                  <td>88%</td>
                  <td>
                    <button><i class="ti ti-eye"></i></button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
      <script src="/js/theme.js"></script>
  </body>
</html>
