<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudentDesk | Teacher Settings</title>
    <link rel="stylesheet" href="/css/teacher.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  </head>
  <body>
    <header>
      <nav class="nav-bar">
        <div class="logo">
          <div class="logo-icon"><i class="ti ti-school"></i></div>
          <h1>Teacher</h1>
        </div>
        <div class="left-access"><button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false"><i class="ti ti-sun"></i></button><button class="profile-img" aria-label="Profile"><i class="bi bi-person-circle"></i></button></div>
      </nav>
    </header>
    <main>
<section class="container" aria-label="Settings">
        
        <div class="Settings">
          <div class="page-head">
            <div>
              <h2>Settings</h2>
              <p>Manage your account and preferences</p>
            </div>
          
              <a class="back-to-dashboard" href="/teacher/"><i class="ti ti-arrow-left"></i>Back to Dashboard</a>
            </div>

          <div class="settings-card">
            <h3>Profile Information</h3>

            <div class="setting-group">
              <label>Full Name</label>
              <input type="text" value="Rajesh Sharma" />
            </div>

            <div class="setting-group">
              <label>Email</label>
              <input type="email" value="rajesh@school.com" />
            </div>

            <div class="setting-group">
              <label>Phone Number</label>
              <input type="text" value="9876543210" />
            </div>
          </div>

          <div class="settings-card">
            <h3>Change Password</h3>

            <div class="setting-group">
              <label>Current Password</label>
              <input type="password" />
            </div>

            <div class="setting-group">
              <label>New Password</label>
              <input type="password" />
            </div>

            <div class="setting-group">
              <label>Confirm Password</label>
              <input type="password" />
            </div>
          </div>

          <div class="settings-card">
            <h3>Notification Preferences</h3>

            <div class="setting-check">
              <input type="checkbox" checked />
              <label>Exam Notifications</label>
            </div>

            <div class="setting-check">
              <input type="checkbox" checked />
              <label>Attendance Alerts</label>
            </div>

            <div class="setting-check">
              <input type="checkbox" checked />
              <label>Notice Updates</label>
            </div>
          </div>

          <div class="settings-card">
            <h3>Appearance</h3>

            <div class="setting-group">
              <label>Theme</label>

              <select>
                <option>Light</option>
                <option>Dark</option>
              </select>
            </div>
          </div>

          <button class="save-btn">
            <i class="ti ti-device-floppy"></i>
            Save Changes
          </button>
        </div>
      </section>
    </main>
      <script src="/js/theme.js"></script>
  </body>
</html>
