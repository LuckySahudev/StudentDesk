<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="/css/login.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>

  <body>
    <button class="theme-toggle login-theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
      <i class="ti ti-sun"></i>
    </button>
    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <div class="logo">
            <i class="ti ti-school"></i>
          </div>

          <h2>School ERP</h2>
          <p>Sign in to continue</p>
        </div>

        <form id="login-form" novalidate>

          <div class="input-group">
            <label for="login-role">Role</label>
            <select id="login-role" name="role" required>
              <option value="" selected disabled>Select Role</option>
              <option value="admin">Admin</option>
              <option value="teacher">Teacher</option>
              <option value="student">Student</option>
            </select>
          </div>

          <div class="input-group">
            <label id="user-id-label" for="user-id">Student ID</label>
            <input id="user-id" name="userId" type="text" inputmode="numeric" autocomplete="username" placeholder="Enter your student ID" required />
          </div>

          <div class="input-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required />
          </div>

          <div class="options">
            <label>
              <input name="remember" type="checkbox" />
              Remember Me
            </label>

            <span>Session expires after 8 hours</span>
          </div>

          <p id="login-error" role="alert" aria-live="polite"></p>
          <button class="login-btn" type="submit">Login</button>
        </form>

        <div class="role-info">
          <p>Login as Admin, Teacher, or Student</p>
        </div>
      </div>
    </div>
    <script src="/js/theme.js"></script>
    <script src="/js/login.js"></script>
  </body>
</html>
