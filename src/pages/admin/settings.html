<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudentDesk | Admin Settings</title>
    <link rel="stylesheet" href="/css/admin.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  </head>
  <body>
    <header>
      <nav class="nav-bar">
        <div class="logo">
          <div class="logo-icon"><i class="ti ti-school"></i></div>
          <h1>Admin</h1>
        </div>
        <div class="left-access"><button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false"><i class="ti ti-sun"></i></button><button class="profile-img" aria-label="Profile"><i class="bi bi-person-circle"></i></button></div>
      </nav>
    </header>
    <main>
<section class="container" aria-label="Settings">
        
        <div class="Settings">
          <div class="page-header">
            <div>
              <h2>Settings</h2>
              <p>Manage system preferences and account settings</p>
            </div>

            <button class="save-settings-btn">
              <i class="ti ti-device-floppy"></i>
              Save Changes
            </button>
          
              <a class="back-to-dashboard" href="/admin/"><i class="ti ti-arrow-left"></i>Back to Dashboard</a>
            </div>

          <div class="settings-card">
            <h3>Admin Profile</h3>

            <div class="setting-group">
              <label>Admin Name</label>
              <input type="text" value="Admin User" />
            </div>

            <div class="setting-group">
              <label>Email</label>
              <input type="email" value="admin@studentdesk.com" />
            </div>
          </div>

          <div class="settings-card">
            <h3>Institute Information</h3>

            <div class="setting-group">
              <label>Institute Name</label>
              <input type="text" value="StudentDesk Academy" />
            </div>

            <div class="setting-group">
              <label>Contact Number</label>
              <input type="text" value="+91 9876543210" />
            </div>
          </div>

          <div class="settings-card">
            <h3>Appearance</h3>

            <div class="setting-group">
              <label>Theme</label>

              <select>
                <option>Light</option>
                <option>Dark</option>
              </select>
            </div>
          </div>

          <div class="settings-card">
            <h3>Security</h3>

            <div class="setting-group">
              <label>Change Password</label>
              <input type="password" placeholder="New Password" />
            </div>
          </div>
        </div>
      </section>
    </main>
      <script src="/js/theme.js"></script>
  </body>
</html>
