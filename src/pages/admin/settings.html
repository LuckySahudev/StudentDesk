<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudentDesk | Admin Settings</title>
    <link rel="stylesheet" href="/css/admin.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  </head>
  <body>
    <header>
      <nav class="nav-bar">
        <div class="logo">
          <div class="logo-icon"><i class="ti ti-school"></i></div>
          <h1>Admin</h1>
        </div>
        <div class="left-access"><button class="profile-img" aria-label="Profile"><i class="bi bi-person-circle"></i></button></div>
      </nav>
    </header>
    <main>
      <aside class="side-bar">
        <div class="logo"><h4>Control Panel</h4></div>
        <nav aria-label="Admin pages"><ul>
            <li><a class="page-link" href="/admin/dashboard"><i class="ti ti-layout-dashboard"></i>Dashboard</a></li>
            <li><a class="page-link" href="/admin/students"><i class="ti ti-users"></i>Students</a></li>
            <li><a class="page-link" href="/admin/teachers"><i class="ti ti-school"></i>Teachers</a></li>
            <li><a class="page-link" href="/admin/attendance"><i class="ti ti-calendar-event"></i>Attendance</a></li>
            <li><a class="page-link" href="/admin/classes"><i class="ti ti-book"></i>Class</a></li>
            <li><a class="page-link" href="/admin/fees"><i class="ti ti-currency-rupee"></i>Fees</a></li>
            <li><a class="page-link" href="/admin/exams"><i class="ti ti-file-text"></i>Exams</a></li>
            <li><a class="page-link" href="/admin/results"><i class="ti ti-chart-bar"></i>Results</a></li>
            <li><a class="page-link" href="/admin/notices"><i class="ti ti-speakerphone"></i>Notices</a></li>
            <li><a class="page-link" href="/admin/timetable"><i class="ti ti-clock"></i>Timetable</a></li>
            <li><a class="page-link" href="/admin/analytics"><i class="ti ti-chart-line"></i>Analytics</a></li>
            <li><a class="page-link active" aria-current="page" href="/admin/settings"><i class="ti ti-settings"></i>Settings</a></li>
        </ul></nav>
        <div class="sidebar-footer"><a href="/"><i class="ti ti-logout"></i> Logout</a></div>
      </aside>
      <section class="container" aria-label="Settings">
        <div class="Settings">
          <div class="page-header">
            <div>
              <h2>Settings</h2>
              <p>Manage system preferences and account settings</p>
            </div>

            <button class="save-settings-btn">
              <i class="ti ti-device-floppy"></i>
              Save Changes
            </button>
          </div>

          <div class="settings-card">
            <h3>Admin Profile</h3>

            <div class="setting-group">
              <label>Admin Name</label>
              <input type="text" value="Admin User" />
            </div>

            <div class="setting-group">
              <label>Email</label>
              <input type="email" value="admin@studentdesk.com" />
            </div>
          </div>

          <div class="settings-card">
            <h3>Institute Information</h3>

            <div class="setting-group">
              <label>Institute Name</label>
              <input type="text" value="StudentDesk Academy" />
            </div>

            <div class="setting-group">
              <label>Contact Number</label>
              <input type="text" value="+91 9876543210" />
            </div>
          </div>

          <div class="settings-card">
            <h3>Appearance</h3>

            <div class="setting-group">
              <label>Theme</label>

              <select>
                <option>Light</option>
                <option>Dark</option>
              </select>
            </div>
          </div>

          <div class="settings-card">
            <h3>Security</h3>

            <div class="setting-group">
              <label>Change Password</label>
              <input type="password" placeholder="New Password" />
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
