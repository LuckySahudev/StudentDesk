<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudentDesk | Admin Class</title>
    <link rel="stylesheet" href="/css/admin.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  </head>
  <body>
    <header>
      <nav class="nav-bar">
        <div class="logo">
          <div class="logo-icon"><i class="ti ti-school"></i></div>
          <h1>Admin</h1>
        </div>
        <div class="left-access"><button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false"><i class="ti ti-sun"></i></button><button class="profile-img" aria-label="Profile"><i class="bi bi-person-circle"></i></button></div>
      </nav>
    </header>
    <main>
<section class="container" aria-label="Class">
        
        <div class="Classes">
          <div class="page-header">
            <div>
              <h2>Class Management</h2>
              <p>Manage classes and sections</p>
            </div>

            <button class="add-class-btn">
              <i class="ti ti-plus"></i>
              Add Class
            </button>
          
              <a class="back-to-dashboard" href="/admin/"><i class="ti ti-arrow-left"></i>Back to Dashboard</a>
            </div>

          <div class="class-stats">
            <div class="stat-card">
              <h4>Total Classes</h4>
              <h2>12</h2>
            </div>

            <div class="stat-card">
              <h4>Total Sections</h4>
              <h2>24</h2>
            </div>

            <div class="stat-card">
              <h4>Total Students</h4>
              <h2>1230</h2>
            </div>

            <div class="stat-card">
              <h4>Class Teachers</h4>
              <h2>12</h2>
            </div>
          </div>

          <div class="class-table">
            <table>
              <thead>
                <tr>
                  <th>Class</th>
                  <th>Section</th>
                  <th>Students</th>
                  <th>Class Teacher</th>
                  <th>Actions</th>
                </tr>
              </thead>

              <tbody>
                <tr>
                  <td>1st</td>
                  <td>A</td>
                  <td>45</td>
                  <td>Mr. Sharma</td>
                  <td>
                    <button><i class="ti ti-eye"></i></button>
                    <button><i class="ti ti-edit"></i></button>
                  </td>
                </tr>

                <tr>
                  <td>2nd</td>
                  <td>B</td>
                  <td>42</td>
                  <td>Mrs. Verma</td>
                  <td>
                    <button><i class="ti ti-eye"></i></button>
                    <button><i class="ti ti-edit"></i></button>
                  </td>
                </tr>

                <tr>
                  <td>3rd</td>
                  <td>A</td>
                  <td>48</td>
                  <td>Mr. Patel</td>
                  <td>
                    <button><i class="ti ti-eye"></i></button>
                    <button><i class="ti ti-edit"></i></button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
      <script src="/js/theme.js"></script>
  </body>
</html>
