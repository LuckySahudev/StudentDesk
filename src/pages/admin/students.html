<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudentDesk | Admin Students</title>
    <link rel="stylesheet" href="/css/admin.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  </head>
  <body>
    <header>
      <nav class="nav-bar">
        <div class="logo">
          <div class="logo-icon"><i class="ti ti-school"></i></div>
          <h1>Admin</h1>
        </div>
        <div class="left-access"><button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false"><i class="ti ti-sun"></i></button><button class="profile-img" aria-label="Profile"><i class="bi bi-person-circle"></i></button></div>
      </nav>
    </header>
    <main>
<section class="container" aria-label="Students">
        
        <div class="Student">
          <div class="page-header">
            <div>
              <h2>Students Management</h2>
              <p>Manage all student records</p>
            </div>

            <button class="add-student-btn">
              <i class="ti ti-plus"></i>
              Add Student
            </button>
          
              <a class="back-to-dashboard" href="/admin/"><i class="ti ti-arrow-left"></i>Back to Dashboard</a>
            </div>

          <div class="student-stats">
            <div class="stat-card">
              <h4>Total Students</h4>
              <h2>1230</h2>
            </div>

            <div class="stat-card">
              <h4>Active Students</h4>
              <h2>1190</h2>
            </div>

            <div class="stat-card">
              <h4>New Admissions</h4>
              <h2>45</h2>
            </div>

            <div class="stat-card">
              <h4>Graduated</h4>
              <h2>120</h2>
            </div>
          </div>

          <div class="student-filters">
            <input type="text" placeholder="Search student..." />

            <select>
              <option>All Classes</option>
              <option>KG</option>
              <option>1st</option>
              <option>2nd</option>
              <option>12th</option>
            </select>
          </div>

          <div class="student-table">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Class</th>
                  <th>Contact</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>

              <tbody>
                <tr>
                  <td>101</td>
                  <td>Rahul Sharma</td>
                  <td>12th A</td>
                  <td>9876543210</td>
                  <td>Active</td>
                  <td>
                    <button><i class="ti ti-eye"></i></button>
                    <button><i class="ti ti-edit"></i></button>
                    <button><i class="ti ti-trash"></i></button>
                  </td>
                </tr>

                <tr>
                  <td>102</td>
                  <td>Priya Patel</td>
                  <td>11th B</td>
                  <td>9876543211</td>
                  <td>Active</td>
                  <td>
                    <button><i class="ti ti-eye"></i></button>
                    <button><i class="ti ti-edit"></i></button>
                    <button><i class="ti ti-trash"></i></button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
      <script src="/js/theme.js"></script>
  </body>
</html>
