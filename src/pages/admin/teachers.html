<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudentDesk | Admin Teachers</title>
    <link rel="stylesheet" href="/css/admin.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  </head>
  <body>
    <header>
      <nav class="nav-bar">
        <div class="logo">
          <div class="logo-icon"><i class="ti ti-school"></i></div>
          <h1>Admin</h1>
        </div>
        <div class="left-access"><button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false"><i class="ti ti-sun"></i></button><button class="profile-img" aria-label="Profile"><i class="bi bi-person-circle"></i></button></div>
      </nav>
    </header>
    <main>
<section class="container" aria-label="Teachers">
        
        <div class="Teacher">
          <div class="page-header">
            <div>
              <h2>Teachers Management</h2>
              <p>Manage all teacher records</p>
            </div>

            <button class="add-teacher-btn">
              <i class="ti ti-plus"></i>
              Add Teacher
            </button>
          
              <a class="back-to-dashboard" href="/admin/"><i class="ti ti-arrow-left"></i>Back to Dashboard</a>
            </div>

          <div class="teacher-stats">
            <div class="stat-card">
              <h4>Total Teachers</h4>
              <h2>130</h2>
            </div>

            <div class="stat-card">
              <h4>Active Teachers</h4>
              <h2>125</h2>
            </div>

            <div class="stat-card">
              <h4>On Leave</h4>
              <h2>5</h2>
            </div>

            <div class="stat-card">
              <h4>Departments</h4>
              <h2>12</h2>
            </div>
          </div>

          <div class="teacher-filters">
            <input type="text" placeholder="Search teacher..." />

            <select>
              <option>All Departments</option>
              <option>CSE</option>
              <option>IT</option>
              <option>ECE</option>
              <option>EE</option>
              <option>ME</option>
            </select>
          </div>

          <div class="teacher-table">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Department</th>
                  <th>Qualification</th>
                  <th>Contact</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>

              <tbody>
                <tr>
                  <td>T101</td>
                  <td>Dr. Amit Sharma</td>
                  <td>CSE</td>
                  <td>Ph.D</td>
                  <td>9876543210</td>
                  <td>Active</td>
                  <td>
                    <button><i class="ti ti-eye"></i></button>
                    <button><i class="ti ti-edit"></i></button>
                    <button><i class="ti ti-trash"></i></button>
                  </td>
                </tr>

                <tr>
                  <td>T102</td>
                  <td>Priya Verma</td>
                  <td>ECE</td>
                  <td>M.Tech</td>
                  <td>9876543211</td>
                  <td>Active</td>
                  <td>
                    <button><i class="ti ti-eye"></i></button>
                    <button><i class="ti ti-edit"></i></button>
                    <button><i class="ti ti-trash"></i></button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
      <script src="/js/theme.js"></script>
  </body>
</html>
